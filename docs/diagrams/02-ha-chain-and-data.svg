<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="XAG resource with hard start dependencies on the PDB service, ACFS and the application VIP; it starts the Service Manager and the source deployment on one RAC node; the target deployment runs under systemd" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>XAG resource with hard start dependencies on the PDB service, ACFS and the application VIP; it starts the Service Manager and the source deployment on one RAC node; the target deployment runs under systemd</title>
<defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a98"/></marker><marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c74634"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22756a"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8661a"/></marker></defs>
<rect x="0" y="0" width="1200" height="670" fill="#ffffff"/>
<rect x="20" y="20" width="800" height="400" rx="10" fill="#edf2f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="40" y="50" font-size="17" fill="#1b2733" font-weight="700">ggrac1 · base state</text>
<text x="40" y="74" font-size="13.5" fill="#5a6675">agctl add goldengate oggsource: one XAG resource for --nodes ggrac1,ggrac2</text>
<rect x="40" y="92" width="280" height="68" rx="10" fill="#fcefed" stroke="#c74634" stroke-width="1.5"/>
<text x="54" y="115" font-size="14.5" fill="#1b2733" font-weight="700">DB service gg_srcpdb</text>
<text x="54" y="137" font-size="13" fill="#1b2733">singleton: ggcdb1, spare ggcdb2</text>
<text x="54" y="156" font-size="13" fill="#5a6675" font-family="Consolas, Menlo, monospace">--db_services --use_local_services</text>
<line x1="320" y1="126" x2="358" y2="126" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<rect x="40" y="170" width="280" height="68" rx="10" fill="#fcefed" stroke="#c74634" stroke-width="1.5"/>
<text x="54" y="193" font-size="14.5" fill="#1b2733" font-weight="700">ACFS /u01/oggdeploy</text>
<text x="54" y="215" font-size="13" fill="#1b2733">ora.data.oggvol.acfs</text>
<text x="54" y="234" font-size="13" fill="#5a6675" font-family="Consolas, Menlo, monospace">--filesystems</text>
<line x1="320" y1="204" x2="358" y2="204" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<rect x="40" y="248" width="280" height="68" rx="10" fill="#fcefed" stroke="#c74634" stroke-width="1.5"/>
<text x="54" y="271" font-size="14.5" fill="#1b2733" font-weight="700">Application VIP oggvip</text>
<text x="54" y="293" font-size="13" fill="#1b2733">192.168.58.40 (appvipcfg)</text>
<text x="54" y="312" font-size="13" fill="#5a6675" font-family="Consolas, Menlo, monospace">--vip_name</text>
<line x1="320" y1="282" x2="358" y2="282" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<rect x="360" y="92" width="190" height="224" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="374" y="116" font-size="15" fill="#1b2733" font-weight="700">XAG resource</text>
<text x="374" y="138" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">xag.oggsource</text>
<text x="374" y="157" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">  .goldengate</text>
<text x="374" y="186.45" font-size="13" fill="#1b2733">hard start</text>
<text x="374" y="205.45" font-size="13" fill="#1b2733">dependency on</text>
<text x="374" y="224.45" font-size="13" fill="#1b2733">all three; starts</text>
<text x="374" y="243.45" font-size="13" fill="#1b2733">only on the node</text>
<text x="374" y="262.45" font-size="13" fill="#1b2733">where they are</text>
<text x="374" y="281.45" font-size="13" fill="#1b2733">ONLINE</text>
<line x1="550" y1="142" x2="588" y2="142" stroke="#1f3a5f" stroke-width="1.8" marker-end="url(#ar-navy)"/>
<rect x="590" y="92" width="210" height="100" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="604" y="116" font-size="15" fill="#1b2733" font-weight="700">Service Manager</text>
<text x="604" y="138" font-size="13" fill="#1b2733">ggsm01 · port 9100</text>
<text x="604" y="157" font-size="13" fill="#1b2733">bound to oggvip</text>
<text x="604" y="176" font-size="13" fill="#5a6675">XAG 10.2 starts / stops it</text>
<line x1="695" y1="192" x2="695" y2="210" stroke="#1f3a5f" stroke-width="1.8" marker-end="url(#ar-navy)"/>
<rect x="590" y="212" width="210" height="104" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="604" y="236" font-size="15" fill="#1b2733" font-weight="700">deployment oggsource</text>
<text x="604" y="258" font-size="13" fill="#1b2733">Admin 9101 · Distrib. 9102</text>
<text x="604" y="277" font-size="13" fill="#1b2733">Receiver 9103 · PM 9104</text>
<text x="604" y="296" font-size="13" fill="#5a6675">files on ACFS</text>
<text x="40" y="344" font-size="13" fill="#5a6675">processes of oggsource (data path: diagram 06)</text>
<rect x="40" y="354" width="230" height="50" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="54" y="384" font-size="13" fill="#1b2733" font-weight="700">EXT1 · Integrated Extract</text>
<line x1="270" y1="379" x2="318" y2="379" stroke="#2f6db5" stroke-width="1.8" marker-end="url(#ar-blue)"/>
<rect x="320" y="354" width="200" height="50" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="334" y="384" font-size="13" fill="#1b2733" font-weight="700">trail et (on ACFS)</text>
<line x1="520" y1="379" x2="568" y2="379" stroke="#2f6db5" stroke-width="1.8" marker-end="url(#ar-blue)"/>
<rect x="570" y="354" width="230" height="50" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="584" y="384" font-size="13" fill="#1b2733" font-weight="700">DP1 · Distribution Path</text>
<rect x="850" y="20" width="330" height="400" rx="10" fill="#f5f7f9" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="870" y="50" font-size="17" fill="#1b2733" font-weight="700">ggrac2 · stand-by node</text>
<rect x="850" y="60" width="330" height="360" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
<text x="870" y="82" font-size="13.5" fill="#1b2733" font-weight="700">XAG starts the chain here:</text>
<text x="870" y="103" font-size="13.5" fill="#1b2733">• planned: agctl relocate (T1)</text>
<text x="870" y="124" font-size="13.5" fill="#1b2733">• ggrac1 powered off (T2)</text>
<text x="870" y="145" font-size="13.5" fill="#1b2733">• by hand after T4 (T4b)</text>
<text x="870" y="177.55" font-size="13.5" fill="#c74634" font-weight="700">Not after an instance crash alone</text>
<text x="870" y="198.55" font-size="13.5" fill="#c74634">(T4): gg_srcpdb moves to ggcdb2,</text>
<text x="870" y="219.55" font-size="13.5" fill="#c74634">XAG stops GoldenGate on ggrac1</text>
<text x="870" y="240.55" font-size="13.5" fill="#c74634">and does not start it on ggrac2.</text>
<text x="870" y="273.1" font-size="13.5" fill="#1b2733">ggcdb2 writes redo thread 2;</text>
<text x="870" y="294.1" font-size="13.5" fill="#1b2733">EXT1 reads both threads from</text>
<text x="870" y="315.1" font-size="13.5" fill="#1b2733">the shared disks.</text>
<polyline points="685,404 685,446 160,446 160,520" fill="none" stroke="#2f6db5" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar-blue)"/>
<text x="700" y="441" font-size="13" fill="#2f6db5">ws://ggtgt.gg.lab.test:9103 (stage A, no TLS)</text>
<rect x="20" y="476" width="1160" height="174" rx="10" fill="#e9f5f2" stroke="#22756a" stroke-width="1.5"/>
<text x="40" y="506" font-size="17" fill="#1b2733" font-weight="700">ggtgt · deployment oggtarget · Service Manager under systemd (no cluster, no XAG)</text>
<rect x="40" y="524" width="240" height="74" rx="10" fill="#ffffff" stroke="#22756a" stroke-width="1.5"/>
<text x="54" y="552" font-size="15" fill="#1b2733" font-weight="700">Receiver Service</text>
<text x="54" y="576" font-size="13" fill="#1b2733">port 9103</text>
<line x1="280" y1="561" x2="328" y2="561" stroke="#22756a" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<rect x="330" y="524" width="230" height="74" rx="10" fill="#ffffff" stroke="#22756a" stroke-width="1.5"/>
<text x="344" y="552" font-size="15" fill="#1b2733" font-weight="700">trail et</text>
<text x="344" y="576" font-size="13" fill="#1b2733">local disk</text>
<line x1="560" y1="561" x2="608" y2="561" stroke="#22756a" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<rect x="610" y="524" width="260" height="74" rx="10" fill="#ffffff" stroke="#22756a" stroke-width="1.5"/>
<text x="624" y="552" font-size="15" fill="#1b2733" font-weight="700">REP1 · Parallel Replicat</text>
<text x="624" y="576" font-size="13" fill="#1b2733">ggadmin.ggs_checkpoint</text>
<line x1="870" y1="561" x2="918" y2="561" stroke="#22756a" stroke-width="1.8" marker-end="url(#ar-teal)"/>
<rect x="920" y="524" width="240" height="74" rx="10" fill="#ffffff" stroke="#22756a" stroke-width="1.5"/>
<text x="934" y="552" font-size="15" fill="#1b2733" font-weight="700">TGTPDB</text>
<text x="934" y="576" font-size="13" fill="#1b2733">tgtcdb, HR + SALES</text>
<text x="40" y="630" font-size="13.5" fill="#5a6675">Both deployments use the MAA profile for EXT1 and REP1: auto start, auto restart (5 retries, 30 s wait).</text>
</svg>
