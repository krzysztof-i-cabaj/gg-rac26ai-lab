<text x="1130" y="218.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T9</text>
<circle cx="836" cy="62" r="15" fill="#c74634"/>
<text x="836" y="66.5" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">T10</text>
<text x="368" y="76" font-size="13" fill="#c74634" text-anchor="end">power off</text>
<text x="768" y="76" font-size="13" fill="#c74634" text-anchor="end">power off</text>
<text x="54" y="286" font-size="13" fill="#c74634">kill -9 PMON</text>
<text x="54" y="196" font-size="13" fill="#c74634">kill -9</text>
<text x="222" y="196" font-size="13" fill="#c74634">kill -9, critical</text>
<text x="450" y="300" font-size="13" fill="#c74634" text-anchor="middle">link down</text>
<text x="970" y="196" font-size="13" fill="#c74634">lag (heartbeat)</text>
<text x="970" y="286" font-size="13" fill="#c74634">data compare</text>
<text x="858" y="52" font-size="13" fill="#c74634">DDL + VECTOR, BOOLEAN, JSON</text>
<text x="40" y="404" font-size="14" fill="#c74634" font-weight="700">T1</text>
<text x="106" y="404" font-size="14" fill="#1b2733">Planned relocation: agctl relocate goldengate</text>
<text x="40" y="434" font-size="14" fill="#c74634" font-weight="700">T2</text>
<text x="106" y="434" font-size="14" fill="#1b2733">Hard power-off of the GoldenGate node ggrac1</text>
<text x="40" y="464" font-size="14" fill="#c74634" font-weight="700">T3</text>
<text x="106" y="464" font-size="14" fill="#1b2733">Power-off of the second node ggrac2</text>
<text x="40" y="494" font-size="14" fill="#c74634" font-weight="700">T4</text>
<text x="106" y="494" font-size="14" fill="#1b2733">Instance crash: kill -9 of PMON ggcdb1</text>
<text x="40" y="524" font-size="14" fill="#c74634" font-weight="700">T4b</text>
<text x="106" y="524" font-size="14" fill="#1b2733">As T4, then GoldenGate moved by hand</text>
<text x="620" y="404" font-size="14" fill="#c74634" font-weight="700">T5</text>
<text x="686" y="404" font-size="14" fill="#1b2733">Kill the Service Manager (kill -9)</text>
<text x="620" y="434" font-size="14" fill="#c74634" font-weight="700">T6</text>
<text x="686" y="434" font-size="14" fill="#1b2733">Kill EXT1 marked “critical to deployment health”</text>
<text x="620" y="464" font-size="14" fill="#c74634" font-weight="700">T7</text>
<text x="686" y="464" font-size="14" fill="#1b2733">Interconnect cut: setlinkstate3 off on ggrac2</text>
<text x="620" y="494" font-size="14" fill="#c74634" font-weight="700">T8 · T9</text>
<text x="686" y="494" font-size="14" fill="#1b2733">Lag under load (10 min) · data comparison</text>
<text x="620" y="524" font-size="14" fill="#c74634" font-weight="700">T10</text>
<text x="686" y="524" font-size="14" fill="#1b2733">DDL and 26ai data types through replication</text>
