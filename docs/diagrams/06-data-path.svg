<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Data path: load on both RAC instances, redo threads 1 and 2, Integrated Extract EXT1, trail on ACFS, Distribution Path DP1, Receiver on ggtgt, Parallel Replicat REP1 into TGTPDB; heartbeat rows measure the lag" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Data path: load on both RAC instances, redo threads 1 and 2, Integrated Extract EXT1, trail on ACFS, Distribution Path DP1, Receiver on ggtgt, Parallel Replicat REP1 into TGTPDB; heartbeat rows measure the lag</title>
<defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a98"/></marker><marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c74634"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22756a"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8661a"/></marker></defs>
<rect x="0" y="0" width="1200" height="690" fill="#ffffff"/>
<rect x="20" y="20" width="1160" height="250" rx="10" fill="#edf2f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="40" y="50" font-size="17" fill="#1b2733" font-weight="700">Source · RAC ggcdb / PDB SRCPDB · deployment oggsource on ggrac1</text>
<rect x="60" y="70" width="240" height="170" rx="10" fill="#ffffff" stroke="#7d8a98" stroke-width="1.5"/>
<text x="74" y="94" font-size="15" fill="#1b2733" font-weight="700">Load on both nodes</text>
<text x="74" y="117" font-size="13" fill="#1b2733">SALES.LOADGEN via SCAN:</text>
<text x="74" y="137" font-size="13" fill="#1b2733">srv_load1 → ggcdb1</text>
<text x="74" y="157" font-size="13" fill="#1b2733">srv_load2 → ggcdb2</text>
<text x="74" y="177" font-size="13" fill="#1b2733">one commit per row,</text>
<text x="74" y="197" font-size="13" fill="#1b2733">SEQ and INST in each row</text>
<rect x="340" y="70" width="240" height="170" rx="10" fill="#ffffff" stroke="#7d8a98" stroke-width="1.5"/>
<text x="354" y="94" font-size="15" fill="#1b2733" font-weight="700">Redo, two threads</text>
<text x="354" y="117" font-size="13" fill="#1b2733">thread 1 (ggcdb1)</text>
<text x="354" y="137" font-size="13" fill="#1b2733">thread 2 (ggcdb2)</text>
<text x="354" y="157" font-size="13" fill="#1b2733">online in +DATA,</text>
<text x="354" y="177" font-size="13" fill="#1b2733">archived in +FRA</text>
<text x="354" y="197" font-size="13" fill="#5a6675">shared by both nodes</text>
<rect x="620" y="70" width="240" height="170" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="634" y="94" font-size="15" fill="#1b2733" font-weight="700">EXT1 · Integrated Extract</text>
<text x="634" y="117" font-size="13" fill="#1b2733">LogMiner in the database,</text>
<text x="634" y="137" font-size="13" fill="#1b2733">per-PDB, reads both threads</text>
<text x="634" y="157" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">TABLE HR.*; TABLE SALES.*</text>
<text x="634" y="177" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">DDL INCLUDE MAPPED</text>
<text x="634" y="197" font-size="13" fill="#5a6675">alias via service gg_srcpdb</text>
<rect x="900" y="70" width="240" height="170" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="914" y="94" font-size="15" fill="#1b2733" font-weight="700">trail et → DP1</text>
<text x="914" y="117" font-size="13" fill="#1b2733">trail files on ACFS</text>
<text x="914" y="137" font-size="13" fill="#1b2733">/u01/oggdeploy</text>
<text x="914" y="168.0" font-size="13" fill="#1b2733">DP1 · Distribution Path</text>
<text x="914" y="188.0" font-size="13" fill="#1b2733">Distribution Service :9102</text>
<line x1="300" y1="155" x2="338" y2="155" stroke="#2f6db5" stroke-width="2" marker-end="url(#ar-blue)"/>
<line x1="580" y1="155" x2="618" y2="155" stroke="#2f6db5" stroke-width="2" marker-end="url(#ar-blue)"/>
<line x1="860" y1="155" x2="898" y2="155" stroke="#2f6db5" stroke-width="2" marker-end="url(#ar-blue)"/>
<polyline points="1020,240 1020,300 180,300 180,338" fill="none" stroke="#2f6db5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ar-blue)"/>
<text x="600" y="292" font-size="13.5" fill="#2f6db5" font-weight="600" text-anchor="middle">ws://ggtgt.gg.lab.test:9103 · host-only network</text>
<rect x="20" y="320" width="1160" height="200" rx="10" fill="#e9f5f2" stroke="#22756a" stroke-width="1.5"/>
<text x="1160" y="348" font-size="17" fill="#1b2733" font-weight="700" text-anchor="end">Target · tgtcdb / PDB TGTPDB · deployment oggtarget on ggtgt</text>
<rect x="60" y="360" width="240" height="140" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="74" y="384" font-size="15" fill="#1b2733" font-weight="700">Receiver Service :9103</text>
<text x="74" y="407" font-size="13" fill="#1b2733">writes trail et</text>
<text x="74" y="427" font-size="13" fill="#1b2733">on the local disk</text>
<rect x="340" y="360" width="240" height="140" rx="10" fill="#eaf2fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="354" y="384" font-size="15" fill="#1b2733" font-weight="700">REP1 · Parallel Replicat</text>
<text x="354" y="407" font-size="13" fill="#1b2733">MAP_PARALLELISM 2</text>
<text x="354" y="427" font-size="13" fill="#1b2733">nonintegrated</text>
<text x="354" y="447" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">ggadmin.ggs_checkpoint</text>
<rect x="620" y="360" width="240" height="140" rx="10" fill="#ffffff" stroke="#7d8a98" stroke-width="1.5"/>
<text x="634" y="384" font-size="15" fill="#1b2733" font-weight="700">TGTPDB</text>
<text x="634" y="407" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">MAP HR.*, TARGET HR.*</text>
<text x="634" y="427" font-size="13" fill="#1b2733" font-family="Consolas, Menlo, monospace">MAP SALES.*, TARGET SALES.*</text>
<text x="634" y="447" font-size="13" fill="#5a6675">same seed rows on both sides</text>
<rect x="900" y="360" width="240" height="140" rx="10" fill="#ffffff" stroke="#7d8a98" stroke-width="1.5"/>
<text x="914" y="384" font-size="15" fill="#1b2733" font-weight="700">Check (T9)</text>
<text x="914" y="407" font-size="13" fill="#1b2733">counts and ORA_HASH</text>
<text x="914" y="427" font-size="13" fill="#1b2733">per table, SEQ per</text>
<text x="914" y="447" font-size="13" fill="#1b2733">instance: missing and</text>
<text x="914" y="467" font-size="13" fill="#1b2733">duplicate rows</text>
<line x1="300" y1="430" x2="338" y2="430" stroke="#2f6db5" stroke-width="2" marker-end="url(#ar-blue)"/>
<line x1="580" y1="430" x2="618" y2="430" stroke="#2f6db5" stroke-width="2" marker-end="url(#ar-blue)"/>
<line x1="860" y1="430" x2="898" y2="430" stroke="#7d8a98" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
<rect x="20" y="540" width="1160" height="130" rx="10" fill="#fcefed" stroke="#c74634" stroke-width="1.5"/>
<text x="40" y="568" font-size="16" fill="#c74634" font-weight="700">Heartbeat: how the lag is measured</text>
<text x="40" y="600" font-size="13.5" fill="#1b2733">source job writes a heartbeat row every 5 s</text>
<line x1="326" y1="596" x2="350" y2="596" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="360" y="600" font-size="13.5" fill="#1b2733">EXT1, DP1, REP1 stamp it</text>
<line x1="596" y1="596" x2="620" y2="596" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="630" y="600" font-size="13.5" fill="#1b2733">target view ggadmin.gg_lag</text>
<line x1="846" y1="596" x2="870" y2="596" stroke="#c74634" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="880" y="600" font-size="13.5" fill="#1b2733">test automation reads every ~1 s</text>
<text x="40" y="630" font-size="13.5" fill="#1b2733">lag = incoming_lag + incoming_heartbeat_age; any stalled link (database frozen, Extract, path, Replicat) makes it grow 1 s per second.</text>
<text x="40" y="654" font-size="13.5" fill="#5a6675">“Lag OK” = below 30 s. Measured under load (T8, 10 min): median 11 s, p95 14 s, max 15 s.</text>
</svg>
