<text x="386" y="88.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T2</text>
<circle cx="786" cy="84" r="15" fill="#c74634"/>
<text x="786" y="88.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T3</text>
<circle cx="204" cy="214" r="15" fill="#c74634"/>
<text x="204" y="218.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T4</text>
<circle cx="204" cy="124" r="15" fill="#c74634"/>
<text x="204" y="128.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T5</text>
<circle cx="372" cy="124" r="15" fill="#c74634"/>
<text x="372" y="128.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T6</text>
<circle cx="450" cy="270" r="15" fill="#c74634"/>
<text x="450" y="274.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T7</text>
<circle cx="1130" cy="124" r="15" fill="#c74634"/>
<text x="1130" y="128.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T8</text>
<circle cx="1130" cy="214" r="15" fill="#c74634"/>
<text x="1130" y="218.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">T9</text>
<circle cx="836" cy="62" r="15" fill="#c74634"/>
<text x="836" y="66.5" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">T10</text>
<text x="368" y="76" font-size="13" fill="#c74634" text-anchor="end">wyłączenie</text>
<text x="768" y="76" font-size="13" fill="#c74634" text-anchor="end">wyłączenie</text>
<text x="54" y="286" font-size="13" fill="#c74634">kill -9 PMON</text>
<text x="54" y="196" font-size="13" fill="#c74634">kill -9</text>
<text x="222" y="196" font-size="13" fill="#c74634">kill -9, krytyczny</text>
<text x="450" y="300" font-size="13" fill="#c74634" text-anchor="middle">łącze w dół</text>
<text x="970" y="196" font-size="13" fill="#c74634">lag (heartbeat)</text>
<text x="970" y="286" font-size="13" fill="#c74634">porównanie</text>
<text x="858" y="52" font-size="13" fill="#c74634">DDL + VECTOR, BOOLEAN, JSON</text>
<text x="40" y="404" font-size="14" fill="#c74634" font-weight="700">T1</text>
<text x="106" y="404" font-size="14" fill="#1b2733">Planowe przeniesienie: agctl relocate goldengate</text>
<text x="40" y="434" font-size="14" fill="#c74634" font-weight="700">T2</text>
<text x="106" y="434" font-size="14" fill="#1b2733">Twarde wyłączenie węzła GoldenGate ggrac1</text>
<text x="40" y="464" font-size="14" fill="#c74634" font-weight="700">T3</text>
<text x="106" y="464" font-size="14" fill="#1b2733">Wyłączenie drugiego węzła ggrac2</text>
<text x="40" y="494" font-size="14" fill="#c74634" font-weight="700">T4</text>
<text x="106" y="494" font-size="14" fill="#1b2733">Awaria instancji: kill -9 procesu PMON ggcdb1</text>
<text x="40" y="524" font-size="14" fill="#c74634" font-weight="700">T4b</text>
<text x="106" y="524" font-size="14" fill="#1b2733">Jak T4, potem ręczne przeniesienie GoldenGate</text>
<text x="620" y="404" font-size="14" fill="#c74634" font-weight="700">T5</text>
<text x="686" y="404" font-size="14" fill="#1b2733">Zabicie Service Managera (kill -9)</text>
<text x="620" y="434" font-size="14" fill="#c74634" font-weight="700">T6</text>
<text x="686" y="434" font-size="14" fill="#1b2733">Zabicie EXT1 oznaczonego jako „critical”</text>
<text x="620" y="464" font-size="14" fill="#c74634" font-weight="700">T7</text>
<text x="686" y="464" font-size="14" fill="#1b2733">Przerwanie interconnectu: setlinkstate3 off na ggrac2</text>
<text x="620" y="494" font-size="14" fill="#c74634" font-weight="700">T8 · T9</text>
<text x="686" y="494" font-size="14" fill="#1b2733">Lag pod obciążeniem (10 min) · porównanie danych</text>
<text x="620" y="524" font-size="14" fill="#c74634" font-weight="700">T10</text>
<text x="686" y="524" font-size="14" fill="#1b2733">DDL i typy danych 26ai przez replikację</text>
</svg>
