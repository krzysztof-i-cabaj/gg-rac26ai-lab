<text x="20" y="310" font-size="14" fill="#1b2733">lab.cmd all runs the steps in this order; a step checks what is done and continues from there.</text>
<text x="20" y="334" font-size="13.5" fill="#5a6675">One step at a time: lab.cmd &lt;step&gt;. Each step ends with its own check (90_validate.sh).</text>
<text x="20" y="356" font-size="13.5" fill="#5a6675">Long steps run under run_step.sh: they survive an SSH drop, a re-run attaches to them.</text>
