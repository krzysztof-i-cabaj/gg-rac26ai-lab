<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Three ways to install the lab: automatic with lab.cmd all, step by step with lab.cmd and a step name, or by hand with the documented commands on your own servers" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Three ways to install the lab: automatic with lab.cmd all, step by step with lab.cmd and a step name, or by hand with the documented commands on your own servers</title>
<defs><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a98"/></marker><marker id="ar-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c74634"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22756a"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8661a"/></marker></defs>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<rect x="20" y="20" width="1160" height="64" rx="10" fill="#f5f7f9" stroke="#7d8a98" stroke-width="1.5"/>
<text x="40" y="48" font-size="15" fill="#1b2733" font-weight="600">Same input for all three: lab.config.psd1 · Oracle packages from eDelivery / My Oracle Support · LAB_PASS</text>
<text x="40" y="70" font-size="13.5" fill="#5a6675">Packages are not in the repository (Oracle licence); lab.cmd plan checks names, disk and RAM before anything runs.</text>
<rect x="20" y="110" width="374" height="380" rx="10" fill="#edf2f8" stroke="#1f3a5f" stroke-width="1.5"/>
<circle cx="54" cy="146" r="17" fill="#1f3a5f"/>
<text x="54" y="150.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="82" y="153" font-size="19" fill="#1b2733" font-weight="700">Automatic</text>
<rect x="40" y="176" width="334" height="38" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="54" y="201" font-size="15" fill="#1f3a5f" font-weight="700" font-family="Consolas, Menlo, monospace">lab.cmd all</text>
<rect x="20" y="222" width="374" height="220" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
<text x="42" y="248" font-size="13.5" fill="#1b2733">One command, VirtualBox on Windows.</text>
<text x="42" y="270" font-size="13.5" fill="#1b2733">Runs iso → plan → … → validate.</text>
<text x="42" y="292" font-size="13.5" fill="#1b2733">After an error: fix the cause,</text>
<text x="42" y="314" font-size="13.5" fill="#1b2733">run it again; done steps are skipped.</text>
<text x="42" y="348.1" font-size="13.5" fill="#1b2733" font-weight="700">For: a working lab quickly.</text>
<text x="42" y="470" font-size="14" fill="#1f3a5f" font-weight="700" font-family="Consolas, Menlo, monospace">→ docs/INSTALL_AUTO.md</text>
<rect x="413" y="110" width="374" height="380" rx="10" fill="#e9f5f2" stroke="#22756a" stroke-width="1.5"/>
<circle cx="447" cy="146" r="17" fill="#22756a"/>
<text x="447" y="150.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="475" y="153" font-size="19" fill="#1b2733" font-weight="700">Step by step</text>
<rect x="433" y="176" width="334" height="38" rx="8" fill="#ffffff" stroke="#22756a" stroke-width="1.5"/>
<text x="447" y="201" font-size="15" fill="#22756a" font-weight="700" font-family="Consolas, Menlo, monospace">lab.cmd &lt;step&gt;</text>
<rect x="413" y="222" width="374" height="220" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
<text x="435" y="248" font-size="13.5" fill="#1b2733">The same scripts, one step at a time:</text>
<text x="435" y="270" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">build · infra · prereq · shared · grid</text>
<text x="435" y="292" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">db · dbca · services · tgt · acfs</text>
<text x="435" y="314" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">ogg · xag · oggconf · validate</text>
<text x="435" y="336" font-size="13.5" fill="#1b2733">Look at the result before going on.</text>
<text x="435" y="358" font-size="13.5" fill="#1b2733" font-weight="700">For: learning what each step does.</text>
<text x="435" y="470" font-size="14" fill="#22756a" font-weight="700" font-family="Consolas, Menlo, monospace">→ docs/INSTALL_STEPWISE.md</text>
<rect x="806" y="110" width="374" height="380" rx="10" fill="#fcefed" stroke="#c74634" stroke-width="1.5"/>
<circle cx="840" cy="146" r="17" fill="#c74634"/>
<text x="840" y="150.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="868" y="153" font-size="19" fill="#1b2733" font-weight="700">By hand</text>
<rect x="826" y="176" width="334" height="38" rx="8" fill="#ffffff" stroke="#c74634" stroke-width="1.5"/>
<text x="840" y="201" font-size="15" fill="#c74634" font-weight="700" font-family="Consolas, Menlo, monospace">commands, no lab.cmd</text>
<rect x="806" y="222" width="374" height="220" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
<text x="828" y="248" font-size="13.5" fill="#1b2733">Your servers: physical or another</text>
<text x="828" y="270" font-size="13.5" fill="#1b2733">hypervisor. Plain commands:</text>
<text x="828" y="292" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">dnf · udev · gridSetup.sh · root.sh</text>
<text x="828" y="314" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">runInstaller · dbca · srvctl · asmcmd</text>
<text x="828" y="336" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">oggca.sh · xagsetup.sh · appvipcfg</text>
<text x="828" y="358" font-size="13.5" fill="#1b2733" font-family="Consolas, Menlo, monospace">agctl · adminclient</text>
<text x="828" y="470" font-size="14" fill="#c74634" font-weight="700" font-family="Consolas, Menlo, monospace">→ docs/MANUAL.md</text>
<polyline points="207,490 207,520 993,520 993,490" fill="none" stroke="#7d8a98" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="600" y1="490" x2="600" y2="520" stroke="#7d8a98" stroke-width="1.6"/>
<line x1="600" y1="520" x2="600" y2="540" stroke="#7d8a98" stroke-width="1.6" marker-end="url(#ar-grey)"/>
<rect x="300" y="542" width="600" height="44" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="600" y="570" font-size="14.5" fill="#1b2733" font-weight="600" text-anchor="middle">Same end state: GoldenGate chain on ggrac1, lag &lt; 30 s, data equal</text>
</svg>
